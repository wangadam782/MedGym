# configs/online_rl/paper.yaml
# Official paper reproduction setting for online RL.

paths:
  # csv: data/mimic_pinn_v4_filtered.csv  # not included; provide locally
  save_root: results/online/policies
  population_pinn_dir: results/pinn/population
  individual_pinn_dir: results/pinn/individual

env:
  total_time_h: 96.0
  dt_min: 0.5
  dt_max: 36.0
  use_lac_penalty: true

rl:
  hidden: 256
  gamma: 0.997

sac:
  total_steps: 100000
  batch_size: 512
  start_steps: 20000
  tau: 0.002
  lr: 0.0001

onpolicy:
  total_steps: 200000
  rollout_len: 2048
  lam: 0.95
  lr_actor: 0.0003
  lr_critic: 0.001
  clip_eps: 0.2
  entropy_coef: 0.01
  delta: 0.01

lagrangian:
  cost_limit: 0.1
  lr_lagrange: 0.05

sweep:
  scope: population
  algos: [sac, ppo, trpo, lagrangian_ppo, lagrangian_trpo]
  k_values: [5, 10, 15, 20]
  dt_modes: [fixdt, vardt]
  n_gpus: 4
  jobs_per_gpu: 2
  skip_done: true
